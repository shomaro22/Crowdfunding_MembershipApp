  /admin/kyc-documents:
    get:
      tags: [Admin]
      summary: Stream KYC identity document (signed token)
      description: |
        Serves a seller identity image using a short-lived HMAC token issued in
        `GET /admin/seller-registrations/{registrationId}` (`identity_document_*_url`).
        Bearer auth is not used; the `token` query parameter is required.
      security: []
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
          description: Signed token from seller registration detail
      responses:
        "200":
          description: Identity document binary
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

