    WSClientFrame:
      oneOf:
        - $ref: "#/components/schemas/WSClientSubscribe"
        - $ref: "#/components/schemas/WSClientTyping"
        - $ref: "#/components/schemas/WSClientPing"

    WSServerFrame:
      oneOf:
        - $ref: "#/components/schemas/WSSessionReadyEvent"
        - $ref: "#/components/schemas/WSSubscribedEvent"
        - $ref: "#/components/schemas/WSUnsubscribedEvent"
        - $ref: "#/components/schemas/WSMessageCreatedEvent"
        - $ref: "#/components/schemas/WSReadUpdatedEvent"
        - $ref: "#/components/schemas/WSTypingEvent"
        - $ref: "#/components/schemas/WSPongEvent"
        - $ref: "#/components/schemas/WSErrorEvent"

    WSClientSubscribe:
      type: object
      required: [type, project_id]
      properties:
        type:
          type: string
          enum: [subscribe, unsubscribe]
        schema_version:
          type: integer
          enum: [1]
        project_id:
          type: string
          format: uuid

    WSClientTyping:
      type: object
      required: [type, project_id]
      properties:
        type:
          type: string
          enum: [typing]
        schema_version:
          type: integer
          enum: [1]
        project_id:
          type: string
          format: uuid
        is_typing:
          type: boolean

    WSClientPing:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [ping]
        schema_version:
          type: integer
          enum: [1]

    WSSessionReadyEvent:
      type: object
      required: [type, schema_version, user_id]
      properties:
        type:
          type: string
          enum: [session_ready]
        schema_version:
          type: integer
          enum: [1]
        user_id:
          type: string
          format: uuid

    WSSubscribedEvent:
      type: object
      required: [type, schema_version, project_id]
      properties:
        type:
          type: string
          enum: [subscribed]
        schema_version:
          type: integer
          enum: [1]
        project_id:
          type: string
          format: uuid

    WSUnsubscribedEvent:
      type: object
      required: [type, schema_version, project_id]
      properties:
        type:
          type: string
          enum: [unsubscribed]
        schema_version:
          type: integer
          enum: [1]
        project_id:
          type: string
          format: uuid

    WSPongEvent:
      type: object
      required: [type, schema_version]
      properties:
        type:
          type: string
          enum: [pong]
        schema_version:
          type: integer
          enum: [1]

    WSTypingEvent:
      type: object
      required: [type, schema_version, project_id, user_id, is_typing]
      properties:
        type:
          type: string
          enum: [typing]
        schema_version:
          type: integer
          enum: [1]
        project_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        is_typing:
          type: boolean

    WSErrorEvent:
      type: object
      required: [type, schema_version, code, message]
      properties:
        type:
          type: string
          enum: [error]
        schema_version:
          type: integer
          enum: [1]
        code:
          type: string
        message:
          type: string
        project_id:
          type: string
          format: uuid

