  /admin/projects/{projectId}:
    patch:
      tags: [Admin]
      summary: Update project status
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/ProjectStatus"
                reason:
                  type: string
                  description: Required when status=CANCELLED (project rejection).
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Admin]
      summary: Hard delete project record
      description: |
        Physically removes the project and related plans/images.
        Allowed only when status is PENDING, CANCELLED, or DELETED.
        ACTIVE projects must use the delete-request flow first.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          description: Project status does not allow hard delete

