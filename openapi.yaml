openapi: 3.0.3
info:
  title: Crowdfunding Membership App API
  version: 1.0.0
  description: |
    NewFF_App を React + Go で再構築するための OpenAPI Specification。
    状態更新は HTTP API、メッセージのリアルタイム配信は WebSocket を利用する。
    認証は **RefreshToken**（httpOnly Cookie）+ **AuthToken**（クライアントメモリのみ）。
    Google OAuth で得る Google 側トークンと、Credentials / OAuth ログイン後に発行する AuthToken / RefreshToken は別物とする。

servers:
  - url: http://localhost:8080
    description: local development

tags:
  - name: Health
  - name: Auth
  - name: Projects
  - name: Supporters
  - name: Purchases
  - name: Payments
  - name: Messages
  - name: Favorites
  - name: Seller
  - name: Media
  - name: Admin
  - name: WebSocket
  - name: Operations

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns API liveness and dependency status (PostgreSQL, Redis).
      operationId: getHealth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                db: ok
                redis: ok

  /auth/register:
    post:
      tags: [Auth]
      summary: Register buyer account (requires admin approval before login)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/register/seller:
    post:
      tags: [Auth]
      summary: Register seller account with driver's license KYC (requires admin approval)
      description: |
        Multipart submission. **運転免許証（DRIVERS_LICENSE）のみ**対象。
        出品者が申告したメタデータ（氏名・生年月日・住所等）と免許証表面・裏面画像を提出する。
        管理者が目視照合する（eKYC 連携なし）。外国籍向けフロー・マイナンバー・パスポート・在留カードはスコープ外。
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [registration, identity_document_front, identity_document_back]
              properties:
                registration:
                  type: string
                  description: JSON string of SellerRegisterPayload
                identity_document_front:
                  type: string
                  format: binary
                  description: Driver's license front (face photo, name, birth date, address visible)
                identity_document_back:
                  type: string
                  format: binary
                  description: Driver's license back (required)
      responses:
        "201":
          description: Seller registration submitted (pending admin KYC review)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerRegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: Identity document image too large
        "415":
          description: Unsupported image media type
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login (Credentials)
      description: |
        成功時は AuthToken（Body）+ RefreshToken（httpOnly Cookie）を返す（§5.1.3）。
        ADMIN/SELLER で TOTP 有効時は `requires_2fa: true` のみ返し、POST /auth/2fa/challenge で AuthToken を取得する。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: User inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset (always returns 200 for privacy)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Accepted
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password by token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset completed
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh AuthToken (RefreshToken in httpOnly Cookie)
      description: |
        Cookie 自動送信で RefreshToken を検証し、新しい AuthToken を返す。
        Rate Limit 対象名は `auth_refresh`（§9.2）。
      security: []
      responses:
        "200":
          description: New AuthToken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and revoke RefreshToken
      responses:
        "200":
          description: Logged out
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/2fa/setup:
    post:
      tags: [Auth]
      summary: Begin TOTP setup (returns QR / secret for authenticator app)
      responses:
        "200":
          description: Setup payload
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/2fa/verify:
    post:
      tags: [Auth]
      summary: Confirm TOTP setup and enable 2FA (after POST /auth/2fa/setup)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: 6-digit TOTP code from authenticator app
      responses:
        "200":
          description: 2FA enabled
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/2fa/challenge:
    post:
      tags: [Auth]
      summary: Complete login 2FA challenge and issue AuthToken
      description: |
        Called after POST /auth/login when 2FA is required (ADMIN/SELLER with TOTP enabled, or BUYER with optional 2FA).
        Rate Limit 対象名は `2fa/challenge`（§9.2: user or email 5 回/分）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: 6-digit TOTP code (backup codes also accepted per §5.1.6)
      responses:
        "200":
          description: AuthToken issued; RefreshToken in httpOnly Cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/check-email:
    get:
      tags: [Auth]
      summary: Check email availability
      security: []
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Availability result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckEmailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/google:
    get:
      tags: [Auth]
      summary: Start Google OAuth (BUYER only). Redirects to Google consent screen.
      security: []
      parameters:
        - in: query
          name: from
          required: false
          schema:
            type: string
          description: Post-login return path (stored in OAuth state)
      responses:
        "302":
          description: Redirect to Google authorization URL
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Google OAuth callback. Sets RefreshToken Cookie and redirects with OAuth Callback Code.
      security: []
      parameters:
        - in: query
          name: code
          schema:
            type: string
        - in: query
          name: state
          schema:
            type: string
        - in: query
          name: error
          schema:
            type: string
      responses:
        "302":
          description: Redirect to PUBLIC_APP_URL/auth/callback (success or error query)
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/oauth/exchange:
    post:
      tags: [Auth]
      summary: Exchange one-time OAuth callback code for AuthToken (memory-only on client)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: One-time code from /auth/callback redirect
      responses:
        "200":
          description: AuthToken issued; RefreshToken in httpOnly Cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /me:
    get:
      tags: [Auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: User inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /me/change-password:
    post:
      tags: [Auth]
      summary: Change current user password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /me/profile:
    get:
      tags: [Auth]
      summary: Get profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Auth]
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/notifications:
    get:
      tags: [Auth]
      summary: Get derived notifications (unread messages, project updates)
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /projects:
    get:
      tags: [Projects]
      summary: List public active projects
      description: |
        Returns projects where `status = ACTIVE` AND
        (`duration_type = UNLIMITED` OR `end_date >= NOW()`).
        無期限プロジェクトは `end_date` が null。
      security: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, supporters, ending_soon]
            default: newest
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProjectsResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Projects]
      summary: Create project (seller only, status=PENDING)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/mine:
    get:
      tags: [Projects]
      summary: List seller's own projects (all statuses)
      responses:
        "200":
          description: Seller projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProjectsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /projects/{projectId}:
    get:
      tags: [Projects]
      summary: Get project detail
      security: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Projects]
      summary: Update project (owner seller)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/delete-request:
    post:
      tags: [Projects]
      summary: Request project deletion (seller)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Delete requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/plans:
    get:
      tags: [Projects]
      summary: List project plans
      security: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectPlan"
        "404":
          $ref: "#/components/responses/NotFound"

  /supporters:
    get:
      tags: [Supporters]
      summary: List current user's supporters (auto-applies pending plan changes)
      responses:
        "200":
          description: Supporter list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSupportersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /supporters/{supporterId}/upgrade:
    post:
      tags: [Supporters]
      summary: Schedule plan upgrade (creates Stripe PaymentIntent for price diff)
      parameters:
        - $ref: "#/components/parameters/SupporterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradePlanRequest"
      responses:
        "200":
          description: Upgrade initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradePlanResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /supporters/{supporterId}/upgrade-confirm:
    post:
      tags: [Supporters]
      summary: Confirm upgrade after PaymentIntent succeeded
      parameters:
        - $ref: "#/components/parameters/SupporterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_intent_id]
              properties:
                payment_intent_id:
                  type: string
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supporter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /supporters/{supporterId}/cancel:
    post:
      tags: [Supporters]
      summary: Cancel supporter at period end
      parameters:
        - $ref: "#/components/parameters/SupporterId"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supporter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /supporters/{supporterId}/rejoin:
    post:
      tags: [Supporters]
      summary: Rejoin from CANCELLED status
      parameters:
        - $ref: "#/components/parameters/SupporterId"
      responses:
        "200":
          description: Rejoined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supporter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /supporters/{supporterId}/billing/change:
    post:
      tags: [Supporters]
      summary: Change billing mode or payment method (effective from next current_period_end)
      description: |
        §5.3.4。AUTO → KONBINI は Subscription cancel_at_period_end。
        KONBINI → AUTO は次周期から Subscription 新規作成 + PM 登録。
        AUTO 内の PM 変更は Stripe Customer default PaymentMethod 更新。
      parameters:
        - $ref: "#/components/parameters/SupporterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeBillingRequest"
      responses:
        "200":
          description: Billing change scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supporter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /purchases:
    get:
      tags: [Purchases]
      summary: List current user's purchases
      responses:
        "200":
          description: Purchase list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPurchasesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /payments/checkout:
    post:
      tags: [Payments]
      summary: Create Stripe Checkout Session (redirect flow)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutSessionRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /payments/intent:
    post:
      tags: [Payments]
      summary: Create Stripe PaymentIntent (embedded Payment Element)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentIntentRequest"
      responses:
        "200":
          description: PaymentIntent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /payments/verify/checkout:
    post:
      tags: [Payments]
      summary: Client-side fallback to verify Checkout Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id:
                  type: string
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supporter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /payments/verify/intent:
    post:
      tags: [Payments]
      summary: Client-side fallback to verify PaymentIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_intent_id]
              properties:
                payment_intent_id:
                  type: string
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supporter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /stripe/webhook:
    post:
      tags: [Payments]
      summary: Stripe webhook handler
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Processed
        "400":
          description: Invalid signature or payload

  /messages:
    get:
      tags: [Messages]
      summary: List messages grouped by project
      parameters:
