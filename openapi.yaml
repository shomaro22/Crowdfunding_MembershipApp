        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/batches/{jobName}/run:
    post:
      tags: [Admin, Operations]
      summary: Manually trigger a batch job (synchronous)
      description: |
        Runs the batch job to completion and returns the final `BatchJobRun` record.
        Only jobs supported by `cmd/batch` are allowed.
      parameters:
        - in: path
          name: jobName
          required: true
          schema:
            type: string
            enum: [apply_plans, expire_supporters, purge_tokens]
        - in: query
          name: dry_run
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Job finished successfully (sync execution)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchJobRun"
        "422":
          description: Job ran to completion but finished with FAILED status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchJobRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/security:
    get:
      tags: [Admin, Operations]
      summary: Security event summary (failed logins, rate limits)
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Security events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEventsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: Query audit logs
      parameters:
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: resource
          schema:
            type: string
        - in: query
          name: admin_id
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAuditLogsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ws/token:
    post:
      tags: [WebSocket]
      summary: Issue one-time WebSocket connection token
      description: |
        Returns a single-use `ws_token` valid for 60 seconds.
        Use with `GET /ws?ws_token=` only. Do not pass JWT in WebSocket query strings.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WSTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /ws:
    get:
      tags: [WebSocket]
      summary: |
        WebSocket upgrade for real-time messaging（仕様書 §17.2）。
        `POST /ws/token` で発行した one-time `ws_token` のみで接続する。
        `?access_token=` および JWT / AuthToken をクエリに載せることは禁止（ログ・Referer 漏洩防止）。
        Client sends subscribe/unsubscribe/ping/typing; server sends session_ready,
        subscribed/unsubscribed, message_created, read_updated, typing, pong, and error frames.
        WebSocket Origin must match CORS_ALLOW_ORIGINS (same as HTTP CORS).
      security: []
      parameters:
        - in: query
          name: ws_token
          required: true
          schema:
            type: string
          description: One-time token from POST /ws/token（60s TTL・1 回限り）。Bearer / AuthToken クエリは不可。
      responses:
        "101":
          description: |
            Switching Protocols. See components/schemas WS* types for client and server frames.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WSClientFrame"
                  - $ref: "#/components/schemas/WSServerFrame"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: AuthToken (自社 JWT, 15 min). Google OAuth tokens are not accepted here.

  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema:
        type: string
        format: uuid
    SupporterId:
      in: path
      name: supporterId
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitedResponse"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required: [status, db, redis]
      properties:
        status:
          type: string
          description: Overall API status
          enum: [ok]
          example: ok
        db:
          type: string
          description: PostgreSQL connectivity
          enum: [ok, error, skipped]
          example: ok
        redis:
          type: string
          description: Redis connectivity
          enum: [ok, error, skipped]
          example: ok

    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string

    RateLimitedResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            retry_after_seconds:
              type: integer

    UserRole:
      type: string
      enum: [BUYER, SELLER, ADMIN]

    ProjectStatus:
      type: string
      enum: [PENDING, ACTIVE, COMPLETED, EXPIRED, CANCELLED, DELETE_REQUESTED, DELETED]

    DurationType:
      type: string
      enum: [UNLIMITED, LIMITED]
      description: |
        UNLIMITED … end_date は null。LIMITED … end_date 必須かつ start_date より後（§5.2.1）。

    MembershipType:
      type: string
      enum: [BRONZE, SILVER, GOLD]

    SupporterStatus:
      type: string
      enum: [ACTIVE, PENDING_RENEWAL, EXPIRED, CANCELLED]
      description: |
        PENDING_RENEWAL … KONBINI 更新未払い。current_period_end までは特典利用可（§5.3.2a）。

    BillingMode:
      type: string
      enum: [AUTO, KONBINI]
      description: |
        AUTO … Stripe Subscription 自動更新。KONBINI … 周期ごとに Checkout/Invoice 手動払込（§5.3.2）。

    PurchaseStatus:
      type: string
      enum: [PENDING, PAID, CANCELLED, REFUNDED, DISPUTED, FAILED]

    PaymentMethod:
      type: string
      enum: [CARD, KONBINI, APPLE_PAY, GOOGLE_PAY]

    RegistrationStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    ReportStatus:
      type: string
      enum: [PENDING, IN_REVIEW, RESOLVED, DISMISSED]

    ReportTargetType:
      type: string
      enum: [PROJECT, MESSAGE, USER]

    CreateReportRequest:
      type: object
      required: [target_type, target_id, reason]
      properties:
        target_type:
          $ref: "#/components/schemas/ReportTargetType"
        target_id:
          type: string
          format: uuid
        reason:
          type: string
        detail:
          type: string

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string

    RegisterResponse:
      type: object
      description: Buyer is created with is_active=false; no tokens until admin approval
      properties:
        user:
          $ref: "#/components/schemas/User"
        message:
          type: string
          example: Registration pending admin approval

    IdentityDocumentType:
      type: string
      enum:
        - DRIVERS_LICENSE
      description: |
        運転免許証のみ対象。表面・裏面の両方が必須。

    SellerRegisterPayload:
      type: object
      description: |
        multipart の `registration` フィールドに JSON 文字列として渡す（§5.1.8）。
        運転免許証（DRIVERS_LICENSE）照合用メタデータ + アカウント情報。
      required:
        - email
        - password
        - full_name
        - birth_date
        - address
        - photo_present
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        full_name:
          type: string
          description: 免許証記載の氏名（例 山田 太郎）
        birth_date:
          type: string
          format: date
          description: 免許証記載の生年月日（例 1990-01-01）
        address:
          type: string
          description: 免許証記載の住所
        photo_present:
          type: boolean
          description: 表面に顔写真が写っていることの申告（管理者が目視確認）

    SellerRegisterRequest:
      description: Alias of SellerRegisterPayload (embedded in multipart registration field)
      allOf:
        - $ref: "#/components/schemas/SellerRegisterPayload"

    SellerRegisterResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        registration:
          $ref: "#/components/schemas/SellerRegistration"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        auth_token:
          type: string
          description: Short-lived AuthToken (JWT); store in memory only, NOT localStorage
        user:
          $ref: "#/components/schemas/User"
        requires_2fa:
          type: boolean
          description: |
            true のとき AuthToken は未発行。POST /auth/2fa/challenge で TOTP 検証後に AuthToken を取得する（§5.1.6）。

    RefreshResponse:
      type: object
      properties:
        auth_token:
          type: string
          description: New AuthToken (JWT); store in memory only

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
        totp_code:
          type: string
          description: SELLER / ADMIN は必須（§5.1.5）。6桁 TOTP またはバックアップコード。

    CheckEmailResponse:
      type: object
      properties:
        available:
          type: boolean

    MeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/UserRole"
        is_active:
          type: boolean
        avatar_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserProfile:
      allOf:
        - $ref: "#/components/schemas/User"

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
        avatar_url:
          type: string

    ProjectPlan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        membership_type:
          $ref: "#/components/schemas/MembershipType"
        price:
          type: integer
          description: JPY
        max_supporters:
          type: integer
          nullable: true
        benefits:
          type: string
        is_active:
          type: boolean
        supporter_count:
          type: integer

    ProjectSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        target_amount:
          type: integer
        current_amount:
          type: integer
        supporter_count:
          type: integer
        duration_type:
          $ref: "#/components/schemas/DurationType"
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
          nullable: true
          description: null when duration_type=UNLIMITED（§5.2.1）
        image_url:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ProjectStatus"
        seller:
          $ref: "#/components/schemas/User"
        plans:
          type: array
          items:
            $ref: "#/components/schemas/ProjectPlan"

    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/ProjectSummary"
        - type: object
          properties:
            images:
              type: array
              items:
                $ref: "#/components/schemas/ProjectImage"
            delete_request:
              type: boolean

    ProjectImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        image_url:
          type: string
        is_main:
          type: boolean
        order:
          type: integer

    ProjectImageInput:
      type: object
      required: [image_url]
      properties:
        image_url:
          type: string
        is_main:
          type: boolean
          default: false
        order:
          type: integer
          minimum: 0

    CreateProjectRequest:
      type: object
      required: [title, description, target_amount, duration_type, start_date, plans]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
        target_amount:
          type: integer
          minimum: 0
        duration_type:
          $ref: "#/components/schemas/DurationType"
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
          nullable: true
          description: Required when duration_type=LIMITED; must be null when UNLIMITED（§5.2.1）
        image_url:
          type: string
          description: Legacy single image. Ignored when images is non-empty.
        images:
          type: array
          maxItems: 10
          description: Project images (§5.2.1). Exactly one must have is_main=true when non-empty.
          items:
            $ref: "#/components/schemas/ProjectImageInput"
        plans:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            required: [membership_type, price, benefits]
            properties:
              membership_type:
                $ref: "#/components/schemas/MembershipType"
              price:
                type: integer
                minimum: 1
                maximum: 100000
              max_supporters:
                type: integer
              benefits:
                type: string

    UpdateProjectRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        target_amount:
          type: integer
        duration_type:
          $ref: "#/components/schemas/DurationType"
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
          nullable: true
        image_url:
          type: string
          description: Legacy single image. Ignored when images is present.
        images:
          type: array
          maxItems: 10
          description: Replaces all project images when present. Empty array clears images.
          items:
            $ref: "#/components/schemas/ProjectImageInput"
        is_reapply:
          type: boolean
          description: If true, status returns to PENDING

    ListProjectsResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Supporter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/SupporterStatus"
        billing_mode:
          $ref: "#/components/schemas/BillingMode"
        start_date:
          type: string
          format: date-time
          description: Alias of current_period_start
        end_date:
          type: string
          format: date-time
          description: Alias of current_period_end（§5.3.0）
        pending_plan_id:
          type: string
          format: uuid
          nullable: true
        plan_change_date:
          type: string
          format: date-time
          nullable: true
        project:
          $ref: "#/components/schemas/ProjectSummary"
        plan:
          $ref: "#/components/schemas/ProjectPlan"
        pending_plan:
          $ref: "#/components/schemas/ProjectPlan"

    ListSupportersResponse:
      type: object
      properties:
        supporters:
          type: array
          items:
            $ref: "#/components/schemas/Supporter"
        total:
          type: integer

    UpgradePlanRequest:
      type: object
      required: [plan_id]
      properties:
        plan_id:
          type: string
          format: uuid

    UpgradePlanResponse:
      type: object
      properties:
        supporter:
          $ref: "#/components/schemas/Supporter"
        payment_intent_client_secret:
          type: string
          nullable: true
          description: Present only for upgrade (higher price)

    ChangeBillingRequest:
      type: object
      required: [billing_mode]
      properties:
        billing_mode:
          $ref: "#/components/schemas/BillingMode"
        payment_method:
          $ref: "#/components/schemas/PaymentMethod"
          description: Required when switching to AUTO or changing PM within AUTO

    Purchase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        supporter_id:
          type: string
          format: uuid
          nullable: true
          description: NULL when Supporter not yet created (e.g. first KONBINI unpaid)
        buyer_id:
          type: string
          format: uuid
        quantity:
          type: integer
        total_price:
          type: integer
        status:
          $ref: "#/components/schemas/PurchaseStatus"
        payment_method:
          $ref: "#/components/schemas/PaymentMethod"
        created_at:
          type: string
          format: date-time
        project:
          $ref: "#/components/schemas/ProjectSummary"
        buyer:
          $ref: "#/components/schemas/User"

    ListPurchasesResponse:
      type: object
      properties:
        purchases:
          type: array
          items:
            $ref: "#/components/schemas/Purchase"
        total:
          type: integer

    CreateCheckoutSessionRequest:
      type: object
      required: [project_id, plan_id]
      properties:
        project_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        payment_method:
          $ref: "#/components/schemas/PaymentMethod"
        success_url:
          type: string
          format: uri
        cancel_url:
          type: string
          format: uri

    CheckoutSessionResponse:
      type: object
      properties:
        session_id:
          type: string
        url:
          type: string
          format: uri

    CreatePaymentIntentRequest:
      type: object
      required: [project_id, plan_id]
      properties:
        project_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid

    PaymentIntentResponse:
      type: object
      properties:
        client_secret:
          type: string
        payment_intent_id:
          type: string

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        receiver_id:
          type: string
          format: uuid
        content:
          type: string
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
        sender:
          $ref: "#/components/schemas/User"
        receiver:
          $ref: "#/components/schemas/User"

    SendMessageRequest:
      type: object
      required: [project_id, receiver_id, content]
      properties:
        project_id:
          type: string
          format: uuid
        receiver_id:
          type: string
          format: uuid
        content:
          type: string
          maxLength: 4000

    MessageThread:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        project_title:
          type: string
        partner:
          $ref: "#/components/schemas/User"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        unread_count:
          type: integer

    ListMessageThreadsResponse:
      type: object
      properties:
        threads:
          type: array
          items:
            $ref: "#/components/schemas/MessageThread"
        total:
          type: integer
          format: int64
        page:
          type: integer
        per_page:
          type: integer

    ToggleFavoriteRequest:
      type: object
      required: [project_id, action]
      properties:
        project_id:
          type: string
          format: uuid
        action:
          type: string
          enum: [add, remove]

    FavoriteStatus:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        is_favorited:
          type: boolean

    ListFavoritesResponse:
      type: object
      properties:
        favorites:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"

    SellerDashboardStats:
      type: object
      properties:
        total_projects:
          type: integer
        active_projects:
          type: integer
        total_supporters:
          type: integer
        total_revenue:
          type: integer

    ConnectAccount:
      type: object
      properties:
        stripe_account_id:
          type: string
        charges_enabled:
          type: boolean
        payouts_enabled:
          type: boolean
        details_submitted:
          type: boolean

    ConnectAccountResponse:
      type: object
      properties:
        account:
          allOf:
            - $ref: "#/components/schemas/ConnectAccount"
          nullable: true

    ConnectOnboardingResponse:
      type: object
      properties:
        url:
          type: string
          format: uri

    ProjectAnalysisResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            type: object
            properties:
              project_id:
                type: string
                format: uuid
              title:
                type: string
              supporter_count:
                type: integer
              revenue:
                type: integer
              plan_breakdown:
                type: object
                additionalProperties:
                  type: integer

    MediaUploadResponse:
      type: object
      properties:
        url:
          type: string
          format: uri

    AdminStats:
      type: object
      properties:
        total_users:
          type: integer
        total_projects:
          type: integer
        total_purchases:
          type: integer
        total_revenue:
          type: integer
        recent_users:
          type: array
          items:
