name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crowdfund
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/crowdfund?sslmode=disable
      REDIS_ADDR: localhost:6379
      JWT_SECRET: "01234567890123456789012345678901"
      REFRESH_SECRET: "01234567890123456789012345678902"
      TOTP_ENCRYPTION_KEY: "01234567890123456789012345678903"
      KYC_SIGNING_KEY: "01234567890123456789012345678904"
      PENDING_2FA_KEY: "01234567890123456789012345678905"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race -count=1 ./...

      - name: Coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

      - name: Coverage gate (core packages 80%)
        run: |
          go test -coverprofile=core.out ./events/... ./model/... ./validator/...
          go tool cover -func=core.out | tail -1
          TOTAL=$(go tool cover -func=core.out | awk '/^total:/ { sub(/%/,"",$3); print $3 }')
          echo "core coverage: ${TOTAL}%"
          awk -v t="$TOTAL" 'BEGIN { if (t+0 < 80) { printf "core coverage %.1f%% below 80%%\n", t; exit 1 } }'

      - name: Integration test
        run: go test -tags=integration -count=1 ./...

      - name: Check no any (Go)
        run: bash scripts/check-no-any.sh

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: |
          docker compose up -d
          for i in $(seq 1 90); do
            if curl -sf http://localhost/health > /dev/null; then
              echo "app ready"
              exit 0
            fi
            sleep 2
          done
          echo "stack did not become ready"
          docker compose logs
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  k6:
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: |
          docker compose up -d
          for i in $(seq 1 90); do
            if curl -sf http://localhost/health > /dev/null; then
              echo "app ready"
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install otplib for admin TOTP
        working-directory: e2e
        run: npm ci

      - name: Prepare admin TOTP
        id: totp
        working-directory: e2e
        run: |
          CODE=$(node -e "const {authenticator}=require('otplib'); console.log(authenticator.generate('JBSWY3DPEHPK3PXP'))")
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: k6 suites
        env:
          K6_ENV: development
          BASE_URL: http://localhost
          ADMIN_TOTP_CODE: ${{ steps.totp.outputs.code }}
        run: |
          mkdir -p k6/reports
          k6 run k6/smoke.js
          k6 run k6/project-list.js
          k6 run k6/notification-load.js
          k6 run k6/auth-load.js
          k6 run k6/checkout-load.js
          k6 run k6/ws-load.js
          k6 run k6/oauth-load.js
          ADMIN_TOTP_CODE=${{ steps.totp.outputs.code }} k6 run k6/admin-load.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-reports
          path: k6/reports/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --target backend-runtime -t crowdfund-app:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
