name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crowdfund
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/crowdfund?sslmode=disable
      REDIS_ADDR: localhost:6379
      JWT_SECRET: "01234567890123456789012345678901"
      REFRESH_SECRET: "01234567890123456789012345678902"
      TOTP_ENCRYPTION_KEY: "01234567890123456789012345678903"
      KYC_SIGNING_KEY: "01234567890123456789012345678904"
      PENDING_2FA_KEY: "01234567890123456789012345678905"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race -count=1 ./...

      - name: Coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

      - name: Coverage gate (core packages 80%)
        run: |
          go test -coverprofile=core.out ./events/... ./model/... ./validator/...
          go tool cover -func=core.out | tail -1
          TOTAL=$(go tool cover -func=core.out | awk '/^total:/ { sub(/%/,"",$3); print $3 }')
          echo "core coverage: ${TOTAL}%"
          awk -v t="$TOTAL" 'BEGIN { if (t+0 < 80) { printf "core coverage %.1f%% below 80%%\n", t; exit 1 } }'

      - name: Integration test
        run: go test -tags=integration -count=1 ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --target backend-runtime -t crowdfund-app:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
