name: crowdfund-app

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crowdfund
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crowdfund"]
      interval: 3s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5

  backend-seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
    entrypoint: ["./seed"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crowdfund?sslmode=disable
      JWT_SECRET: dev-only-change-me-32-chars-min!!
      TEST_USER_PASSWORD: password123
      SEED_TEST_USER_TEAM: "1"
      SEED_TEST_USER_RESET: "1"
      PRIVATE_ROOT: /app/data/private
    volumes:
      - private_data:/app/data/private
    command: ["dev", "-team", "-reset"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crowdfund?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: dev-only-change-me-32-chars-min!!
      PUBLIC_ROOT: /app/data/public
      PRIVATE_ROOT: /app/data/private
      PORT: "8080"
      API_PUBLIC_URL: http://localhost
      PUBLIC_APP_URL: http://localhost
      CORS_ALLOW_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173
      COOKIE_SECURE: "false"
      STRIPE_USE_STUB: ${STRIPE_USE_STUB:-1}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_test}
      STRIPE_CONNECT_RETURN_URL: ${STRIPE_CONNECT_RETURN_URL:-http://localhost/seller/connect/return}
      STRIPE_CONNECT_REFRESH_URL: ${STRIPE_CONNECT_REFRESH_URL:-http://localhost/seller/connect/refresh}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-230753630723-i3ap0modn4mcvhjkl2l8kpoku11flscu.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-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}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost/auth/google/callback}
    volumes:
      - uploads:/app/data/public
      - private_data:/app/data/private
    depends_on:
      backend-seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  private_data:
