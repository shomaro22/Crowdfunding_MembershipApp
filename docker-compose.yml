name: crowdfund-app

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crowdfund
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crowdfund"]
      interval: 3s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5

  backend-seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
    entrypoint: ["./seed"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crowdfund?sslmode=disable
      JWT_SECRET: dev-only-change-me-32-chars-min!!
      TEST_USER_PASSWORD: password123
      SEED_TEST_USER_TEAM: "1"
      SEED_TEST_USER_RESET: "1"
    command: ["dev", "-team", "-reset"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crowdfund?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: dev-only-change-me-32-chars-min!!
      PUBLIC_ROOT: /app/data/public
      PRIVATE_ROOT: /app/data/private
      PORT: "8080"
      API_PUBLIC_URL: http://localhost:8080
      PUBLIC_APP_URL: http://localhost:5173
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      COOKIE_SECURE: "false"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CONNECT_RETURN_URL: ${STRIPE_CONNECT_RETURN_URL:-http://localhost:5173/seller/connect/return}
      STRIPE_CONNECT_REFRESH_URL: ${STRIPE_CONNECT_REFRESH_URL:-http://localhost:5173/seller/connect/refresh}
    volumes:
      - uploads:/app/data/public
    depends_on:
      backend-seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
